name: test-image
on:
  push:
    branches:
      - 'tmp/emudhra-test-image'
jobs:
  image:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Publish test docker image
        run: |
          ./gradlew bootBuildImage -PprojVersion=emudhra-test --publishImage -PdockerRegistryUsername=${{ secrets.PACKAGE_REGISTRY_GITHUB_USER }} -PdockerRegistryPassword=${{ secrets.PACKAGE_REGISTRY_GITHUB_TOKEN }}
